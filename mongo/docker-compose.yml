services:
  mongo:
    image: mongo:7.0
    container_name: mongo-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    container_name: books-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MONGO_URL=mongodb://mongo:27017/library
      - PORT=8080
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - library-net

networks:
  library-net:
    driver: bridge

volumes:
  mongo-data:
